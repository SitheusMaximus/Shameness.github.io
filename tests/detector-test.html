<!doctype html>
<html><body style="background:#111;color:#eee;font:14px system-ui"><pre id="out">Running…</pre>
<script type="module">
import { BOARD, CELL_COUNT, PIECES } from '../solver.js';
import { locateBoard, classifyBoard, boardPoint } from '../detector.js';

const source = document.createElement('canvas');
source.width = 920; source.height = 760;
const c = source.getContext('2d');
c.fillStyle = '#161a20'; c.fillRect(0,0,source.width,source.height);
const center = {x: 575, y: 380};
const hexSize = 30;
const palette = {
  [PIECES.AIR]:'#73c2fb', [PIECES.FIRE]:'#fc6600', [PIECES.WATER]:'#4f97a3', [PIECES.EARTH]:'#4cbb17',
  [PIECES.LEAD]:'#4682b4', [PIECES.TIN]:'#a9ba9d', [PIECES.IRON]:'#702963', [PIECES.COPPER]:'#ca3433',
  [PIECES.SILVER]:'#696980', [PIECES.GOLD]:'#f9a602', [PIECES.MORS]:'#222021', [PIECES.VITAE]:'#fdb9c8'
};
for (const cell of BOARD.cells) {
  const p = boardPoint(center, hexSize, cell);
  c.beginPath();
  for (let i=0;i<6;i++) {
    const a=Math.PI/2+i*Math.PI/3;
    const x=p.x+(hexSize-2)*Math.cos(a), y=p.y+(hexSize-2)*Math.sin(a);
    if(i===0)c.moveTo(x,y); else c.lineTo(x,y);
  }
  c.closePath(); c.fillStyle='#c9bea2'; c.fill(); c.strokeStyle='#827862'; c.stroke();
}
const placements = [
  [0,PIECES.AIR],[1,PIECES.AIR],[2,PIECES.FIRE],[4,PIECES.WATER],[7,PIECES.EARTH],[10,PIECES.LEAD],
  [13,PIECES.TIN],[16,PIECES.IRON],[20,PIECES.COPPER],[24,PIECES.SILVER],[28,PIECES.GOLD],[32,PIECES.MORS],[36,PIECES.VITAE]
];
for (const [idx,type] of placements) {
  const p=boardPoint(center,hexSize,BOARD.cells[idx]);
  c.beginPath(); c.arc(p.x,p.y,hexSize*.56,0,Math.PI*2); c.fillStyle=palette[type]; c.fill();
}
const data = c.getImageData(0,0,source.width,source.height);
const located=locateBoard(data);
const detected=located ? classifyBoard(data,located) : null;
const found = detected ? placements.filter(([idx,type]) => detected.cells[idx]===type).length : 0;
const out = {cellCount:CELL_COUNT,located:!!located,found,expected:placements.length,summary:detected?.summary};
document.getElementById('out').textContent=JSON.stringify(out,null,2);
</script></body></html>
